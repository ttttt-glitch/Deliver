<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garowe Express - Driver Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased pb-24">

    <!-- Driver Header -->
    <header class="bg-blue-700 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-base font-bold tracking-wide">🛵 Garowe Express - Driver Dashboard</h1>
            <span id="driver-status" class="text-xs bg-blue-800 px-2.5 py-1 rounded-full font-medium">Online</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
            <span class="text-xs font-bold text-gray-700 uppercase">Available Orders (Garowe)</span>
            <span id="pending-count" class="text-xs bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full font-semibold">0 pending</span>
        </div>

        <!-- Live Orders Feed for Drivers -->
        <div id="driver-orders-container" class="space-y-3">
            <div class="bg-white p-6 rounded-xl text-center text-gray-400 text-sm border border-gray-100">Loading incoming orders...</div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://caxcppreyuyyobhjjciy.supabase.co/rest/v1";
        const SUPABASE_KEY = "sb_publishable_x3q2HIrBuWLv-AlGQ5LUgQ_uHolKke_";
        const DRIVER_NAME = "Darawal Garowe #1";

        async function fetchDriverOrders() {
            const container = document.getElementById('driver-orders-container');
            try {
                const response = await fetch(`${SUPABASE_URL}/deliveries?select=*&order=created_at.desc`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`Database error: ${response.statusText}`);
                }

                const orders = await response.json();
                renderDriverOrders(orders || []);
            } catch (err) {
                console.error('Fetch error:', err);
                container.innerHTML = `<div class="bg-red-50 p-4 rounded-xl text-center text-red-600 text-xs border border-red-200">Error loading orders: ${err.message}</div>`;
            }
        }

        function renderDriverOrders(orders) {
            const container = document.getElementById('driver-orders-container');
            container.innerHTML = '';
            
            const pendingOrders = orders.filter(o => {
                const status = (o.delivery_status || 'Pending').toLowerCase();
                return status === 'pending' || status === '';
            });

            document.getElementById('pending-count').innerText = `${pendingOrders.length} pending`;

            if (orders.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-gray-400 text-sm border border-gray-100">Ma jiraan dalabyo hadda taagan.</div>`;
                return;
            }

            orders.forEach(order => {
                const statusStr = (order.delivery_status || 'Pending').toLowerCase();
                const isPending = statusStr === 'pending' || statusStr === '';
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-2";
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded">ID: ${order.id ? String(order.id).slice(0,6) : 'N/A'}</span>
                        <span class="text-xs font-semibold px-2 py-0.5 rounded border ${isPending ? 'bg-amber-50 text-amber-700 border-amber-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200'}">${order.delivery_status || 'Pending'}</span>
                    </div>
                    <div>
                        <h4 class="font-bold text-gray-900 text-sm">${order.merchant_name || 'Unknown Merchant'}</h4>
                        <p class="text-xs text-gray-600 mt-0.5">📦 ${order.item_details || 'No details'} ($${order.amount || 0})</p>
                        <p class="text-xs text-gray-400 mt-1">📍 Xaafadda: ${order.zone || 'N/A'} | 📱 ${order.phone || 'N/A'}</p>
                    </div>
                    <div class="pt-2 flex gap-2">
                        ${isPending ? `
                            <button onclick="updateStatus('${order.id}', 'Accepted')" class="w-full bg-blue-600 text-white py-2 rounded-lg text-xs font-semibold hover:bg-blue-700 transition">
                                Accept Order (Ogolaado)
                            </button>
                        ` : `
                            <button onclick="updateStatus('${order.id}', 'Delivered')" class="w-full bg-emerald-600 text-white py-2 rounded-lg text-xs font-semibold hover:bg-emerald-700 transition">
                                Mark Delivered (La Gaarsiiyay)
                            </button>
                        `}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.updateStatus = async function(id, newStatus) {
            try {
                const response = await fetch(`${SUPABASE_URL}/deliveries?id=eq.${id}`, {
                    method: 'PATCH',
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify({ delivery_status: newStatus, driver_name: DRIVER_NAME })
                });

                if (!response.ok) {
                    throw new Error('Failed to update status');
                }
                fetchDriverOrders();
            } catch (err) {
                alert('Error updating order: ' + err.message);
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            fetchDriverOrders();
            // Auto refresh every 5 seconds as a reliable fallback live mechanism
            setInterval(fetchDriverOrders, 5000);
        });
    </script>
</body>
</html>

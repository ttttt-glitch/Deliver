<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garowe Express - Driver Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased pb-24">

    <!-- Driver Header -->
    <header class="bg-blue-700 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-base font-bold tracking-wide">🛵 Garowe Express - Driver Dashboard</h1>
            <span id="driver-status" class="text-xs bg-blue-800 px-2.5 py-1 rounded-full font-medium">Online</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">
        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
            <span class="text-xs font-bold text-gray-700 uppercase">Available Orders (Garowe)</span>
            <span id="pending-count" class="text-xs bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full font-semibold">0 pending</span>
        </div>

        <!-- Live Orders Feed for Drivers -->
        <div id="driver-orders-container" class="space-y-3">
            <div class="bg-white p-6 rounded-xl text-center text-gray-400 text-sm border border-gray-100">Loading incoming orders...</div>
        </div>
    </main>

    <script type="module">
        import { supabase } from './supabase-config.js';
        import { updateDeliveryStatus, subscribeToDeliveries } from './orders-sync.js';

        const DRIVER_NAME = "Darawal Garowe #1";

        async function fetchDriverOrders() {
            const { data: orders, error } = await supabase
                .from('deliveries')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error fetching orders:', error);
                return;
            }

            renderDriverOrders(orders);
        }

        function renderDriverOrders(orders) {
            const container = document.getElementById('driver-orders-container');
            container.innerHTML = '';
            
            const pendingOrders = orders.filter(o => o.delivery_status === 'Pending' || !o.delivery_status);
            document.getElementById('pending-count').innerText = `${pendingOrders.length} pending`;

            if (orders.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-gray-400 text-sm border border-gray-100">Ma jiraan dalabyo hadda taagan.</div>`;
                return;
            }

            orders.forEach(order => {
                const isPending = order.delivery_status === 'Pending' || !order.delivery_status;
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-2";
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded">ID: ${order.id.slice(0,6)}</span>
                        <span class="text-xs font-semibold px-2 py-0.5 rounded border ${isPending ? 'bg-amber-50 text-amber-700 border-amber-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200'}">${order.delivery_status || 'Pending'}</span>
                    </div>
                    <div>
                        <h4 class="font-bold text-gray-900 text-sm">${order.merchant_name}</h4>
                        <p class="text-xs text-gray-600 mt-0.5">📦 ${order.item_details} ($${order.amount})</p>
                        <p class="text-xs text-gray-400 mt-1">📍 Xaafadda: ${order.zone} | 📱 ${order.phone}</p>
                    </div>
                    <div class="pt-2 flex gap-2">
                        ${isPending ? `
                            <button onclick="acceptOrder('${order.id}')" class="w-full bg-blue-600 text-white py-2 rounded-lg text-xs font-semibold hover:bg-blue-700 transition">
                                Accept Order (Ogolaado)
                            </button>
                        ` : `
                            <button onclick="completeOrder('${order.id}')" class="w-full bg-emerald-600 text-white py-2 rounded-lg text-xs font-semibold hover:bg-emerald-700 transition">
                                Mark Delivered (La Gaarsiiyay)
                            </button>
                        `}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Expose actions globally for inline button onclick handlers
        window.acceptOrder = async function(id) {
            await updateDeliveryStatus(id, 'Accepted', DRIVER_NAME);
            fetchDriverOrders();
        };

        window.completeOrder = async function(id) {
            await updateDeliveryStatus(id, 'Delivered', DRIVER_NAME);
            fetchDriverOrders();
        };

        // Initialize and listen live
        window.addEventListener('DOMContentLoaded', () => {
            fetchDriverOrders();
            subscribeToDeliveries(() => {
                fetchDriverOrders(); // Refresh automatically on any database change
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garowe Express - Multi-Tenant Dispatch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta name="theme-color" content="#047857">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased pb-24">

    <!-- App Header -->
    <header class="bg-emerald-700 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-base font-bold tracking-wide">📦 Garowe Express SaaS</h1>
            <div class="flex items-center gap-2">
                <span id="current-tenant-badge" class="text-xs bg-emerald-800 px-2.5 py-1 rounded-full font-medium">Tenant: tenant_demo</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Tenant Switcher Bar -->
        <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
            <span class="text-xs font-bold text-gray-700 uppercase">Tenant Switcher:</span>
            <div class="flex gap-1">
                <button id="btn-tenant-a" class="px-2.5 py-1 text-xs font-semibold bg-emerald-50 text-emerald-700 rounded border border-emerald-200">Shop A</button>
                <button id="btn-tenant-b" class="px-2.5 py-1 text-xs font-semibold bg-gray-50 text-gray-600 rounded border border-gray-200">Shop B</button>
                <button id="btn-logout" class="px-2 py-1 text-xs font-semibold bg-red-50 text-red-600 rounded border border-red-200">Reset</button>
            </div>
        </div>

        <!-- Quick Stats Overview -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100">
                <p class="text-xs text-gray-500 font-medium">Shop Orders</p>
                <p id="stat-tenant-orders" class="text-xl font-bold text-emerald-600">0</p>
            </div>
            <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100">
                <p class="text-xs text-gray-500 font-medium">Global Rev ($)</p>
                <p id="stat-global-rev" class="text-xl font-bold text-amber-600">$0.00</p>
            </div>
        </div>

        <!-- Add New Order Form -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-xs font-bold text-gray-800 mb-3 uppercase tracking-wider">Diiwaan Geli Dalab (Tenant Isolated)</h2>
            <form id="order-form" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Magaca Ganacsiga (Merchant Name)</label>
                    <input type="text" id="merchant-name" required placeholder="Tusaale: Ganacsiga Bariga" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Telefoonka</label>
                        <input type="text" id="customer-phone" required placeholder="090XXXXXXX" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Xaafadda (Zone)</label>
                        <select id="delivery-zone" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <option value="Wadajir">Wadajir</option>
                            <option value="Hodan">Hodan</option>
                            <option value="Waaberi">Waaberi</option>
                            <option value="Shangani">Shangani</option>
                            <option value="Garowe Nugaal">Garowe Nugaal</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Faahfaahinta Alaabta</label>
                    <input type="text" id="item-details" required placeholder="Tusaale: 2x Solar Kits" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Lacagta ($ USD)</label>
                        <input type="number" step="0.01" id="amount" required placeholder="0.00" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Nooca Bixinta</label>
                        <select id="payment-status" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <option value="Paid">Paid</option>
                            <option value="Unpaid">Unpaid (Deyn)</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-emerald-700 transition shadow-sm">
                    Keydi Dalabka (Save Order)
                </button>
            </form>
        </div>

        <!-- Orders List Header -->
        <div class="flex justify-between items-center pt-2">
            <h3 class="text-xs font-bold text-gray-800 uppercase tracking-wider">Dalabyada Dukaanakaan (Tenant Orders)</h3>
            <span id="order-count" class="text-xs text-gray-500">0 dalab</span>
        </div>

        <!-- Orders Container -->
        <div id="orders-container" class="space-y-3">
            <!-- Dynamic Tenant Orders Injected Here -->
        </div>

        <!-- Platform Admin Bar -->
        <div class="bg-gray-800 text-white p-3 rounded-xl shadow-sm text-xs space-y-1">
            <p class="font-bold text-emerald-400 uppercase tracking-wider">Platform Admin Metrics (Global)</p>
            <div class="flex justify-between">
                <span>Total Tenants: <strong id="admin-tenants">2</strong></span>
                <span>Total Deliveries: <strong id="admin-deliveries">0</strong></span>
            </div>
        </div>

    </main>

    <!-- Native ES Module Integration Script -->
    <script type="module">
        import { setCurrentShop, getCurrentShop, logoutCurrentShop } from './auth.js';
        import {
            saveOrderToCloud,
            fetchTenantOrdersCloud,
            syncOfflineOrders,
            subscribeToDeliveries
        } from './orders-sync.js';

        // ---------- UI Rendering ----------
        async function updateUI() {
            const currentShop = getCurrentShop();
            document.getElementById('current-tenant-badge').innerText = `Tenant: ${currentShop}`;

            const btnA = document.getElementById('btn-tenant-a');
            const btnB = document.getElementById('btn-tenant-b');

            const inactive = "px-2.5 py-1 text-xs font-semibold bg-gray-50 text-gray-600 rounded border border-gray-200";
            const active   = "px-2.5 py-1 text-xs font-semibold bg-emerald-600 text-white rounded border border-emerald-600";

            btnA.className = (currentShop === 'shop_garowe_wholesalers') ? active : inactive;
            btnB.className = (currentShop === 'shop_nugaal_electronics') ? active : inactive;

            // Load tenant-isolated orders
            const orders = await fetchTenantOrdersCloud(currentShop);
            const container = document.getElementById('orders-container');
            container.innerHTML = '';
            document.getElementById('order-count').innerText = `${orders.length} dalab`;
            document.getElementById('stat-tenant-orders').innerText = orders.length;

            const totalRev = orders.reduce((acc, o) => acc + (Number(o.amount) || 0), 0);
            document.getElementById('stat-global-rev').innerText = `$${totalRev.toFixed(2)}`;
            document.getElementById('admin-deliveries').innerText = orders.length;

            if (orders.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-gray-400 text-sm border border-gray-100">Ma jiraan dalabyo dukaanakaan leh.</div>`;
                return;
            }

            orders.forEach(order => {
                const status = order.delivery_status || 'Pending';
                const isPending = status.toLowerCase() === 'pending';
                const badgeColor = isPending
                    ? 'bg-amber-50 text-amber-700 border-amber-200'
                    : 'bg-emerald-50 text-emerald-700 border-emerald-200';

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-2";
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded">
                            ${order.id ? String(order.id).slice(0,8) : 'N/A'}
                        </span>
                        <span class="text-xs font-semibold px-2 py-0.5 rounded border ${badgeColor}">${status}</span>
                    </div>
                    <div>
                        <div class="flex justify-between items-baseline">
                            <h4 class="font-bold text-gray-900 text-sm">${order.merchant_name || 'Unknown'}</h4>
                            <span class="text-sm font-bold text-gray-900">$${Number(order.amount || 0).toFixed(2)}</span>
                        </div>
                        <p class="text-xs text-gray-600 mt-0.5">${order.item_details || ''}</p>
                        <p class="text-xs text-gray-400 mt-1">📍 ${order.zone || ''} | 📱 ${order.phone || ''}</p>
                        ${order.driver_name ? `<p class="text-xs text-blue-600 font-semibold mt-1">🛵 Darawal: ${order.driver_name}</p>` : ''}
                        <p class="text-xs text-emerald-600 font-medium mt-1">💳 Bixinta: ${order.payment_status || 'Paid'}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ---------- Tenant Switcher ----------
        document.getElementById('btn-tenant-a').addEventListener('click', async () => {
            setCurrentShop('shop_garowe_wholesalers');
            await updateUI();
        });

        document.getElementById('btn-tenant-b').addEventListener('click', async () => {
            setCurrentShop('shop_nugaal_electronics');
            await updateUI();
        });

        document.getElementById('btn-logout').addEventListener('click', async () => {
            logoutCurrentShop();
            await updateUI();
        });

        // ---------- Form Submit ----------
        document.getElementById('order-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                merchant_name: document.getElementById('merchant-name').value,
                phone:         document.getElementById('customer-phone').value,
                zone:          document.getElementById('delivery-zone').value,
                item_details:  document.getElementById('item-details').value,
                amount:        parseFloat(document.getElementById('amount').value) || 0,
                payment_status: document.getElementById('payment-status').value
            };

            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerText = "Kaydinaya... (Saving)";

            try {
                // 1. Push directly to Supabase (this is what makes drivers see it)
                const savedOrder = await saveOrderToCloud(formData);
                console.log("✅ Order saved:", savedOrder);

                // 2. Try to flush any offline queue (in case we were offline earlier)
                try { await syncOfflineOrders(); } catch (e) { /* silent */ }

                // 3. Reset form + refresh UI
                document.getElementById('order-form').reset();
                await updateUI();

                alert("✅ Dalabka waa la keydiyay! Darawalku wuu arki doonaa.");
            } catch (err) {
                console.error("❌ Submission error:", err);
                alert("⚠️ Cilad ayaa dhacday: " + err.message + "\n\nDalabka waxaa lagu kaydiyay qalabkaaga (offline).");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Keydi Dalabka (Save Order)";
            }
        });

        // ---------- Boot ----------
        window.addEventListener('DOMContentLoaded', async () => {
            try { await syncOfflineOrders(); } catch (e) { console.warn("Offline sync skipped:", e); }

            await updateUI();

            // Realtime updates from Supabase
            try {
                subscribeToDeliveries(() => {
                    console.log("🔔 Realtime update received");
                    updateUI();
                });
            } catch (e) {
                console.warn("Realtime subscribe failed:", e);
            }

            // Fallback polling every 15s (in case websocket drops on mobile)
            setInterval(() => { updateUI(); }, 15000);
        });
    </script>
</body>
</html>

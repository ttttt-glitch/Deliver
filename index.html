<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garowe Express - Logistics & Dispatch</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#047857">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased pb-24">

    <!-- App Header -->
    <header class="bg-emerald-700 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-base font-bold tracking-wide">📦 Garowe Express Dispatch</h1>
            <span id="pwa-status" class="text-xs bg-emerald-800 px-2.5 py-1 rounded-full font-medium">Ready</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Quick Stats Overview -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100">
                <p class="text-xs text-gray-500 font-medium">Dalabyada Taagan (Pending)</p>
                <p id="stat-pending" class="text-xl font-bold text-amber-600">0</p>
            </div>
            <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100">
                <p class="text-xs text-gray-500 font-medium">La Gaarsiiyay (Completed)</p>
                <p id="stat-completed" class="text-xl font-bold text-emerald-600">0</p>
            </div>
        </div>

        <!-- Add New Order Form -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-xs font-bold text-gray-800 mb-3 uppercase tracking-wider">Diiwaan Geli Dalab Cusub</h2>
            <form id="order-form" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Magaca Dukaan / Ganacsiga</label>
                    <input type="text" id="shop-name" required placeholder="Tusaale: Ganacsiga Bariga" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Telefoonka</label>
                        <input type="text" id="customer-phone" required placeholder="090XXXXXXX" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Xaafadda (Zone)</label>
                        <select id="delivery-zone" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <option value="Wadajir">Wadajir</option>
                            <option value="Hodan">Hodan</option>
                            <option value="Waaberi">Waaberi</option>
                            <option value="Shangani">Shangani</option>
                            <option value="Garowe Nugaal">Garowe Mowlac</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Faahfaahinta Alaabta</label>
                    <input type="text" id="items-summary" required placeholder="Tusaale: 2x Solar Kits, LED Bulbs" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Lacagta ($ USD)</label>
                        <input type="number" step="0.01" id="total-price" required placeholder="0.00" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Nooca Bixinta</label>
                        <select id="payment-status" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                            <option value="Paid (Sahal/EVC)">Paid (Sahal / EVC)</option>
                            <option value="Cash on Delivery">Cash on Delivery</option>
                            <option value="Unpaid (Deyn)">Unpaid (Deyn)</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-emerald-700 transition shadow-sm">
                    Keydi Dalabka (Save Order)
                </button>
            </form>
        </div>

        <!-- Orders List Header -->
        <div class="flex justify-between items-center pt-2">
            <h3 class="text-xs font-bold text-gray-800 uppercase tracking-wider">Dalabyada Active-ka ah</h3>
            <span id="order-count" class="text-xs text-gray-500">0 dalab</span>
        </div>

        <!-- Orders Container -->
        <div id="orders-container" class="space-y-3">
            <!-- Dynamic Cards Injected Here -->
        </div>

    </main>

    <!-- IndexedDB, USSD & App Core Logic -->
    <script>
        let db;
        const DB_NAME = 'GaroweLogisticsDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'orders';
        const MERCHANT_CODE = "252907XXXXXX"; // Replace with your actual merchant/phone number

        function initDB() {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            request.onerror = e => console.error("DB Error:", e.target.errorCode);
            request.onsuccess = e => {
                db = e.target.result;
                loadOrders();
            };
            request.onupgradeneeded = e => {
                const dbInstance = e.target.result;
                if (!dbInstance.objectStoreNames.contains(STORE_NAME)) {
                    dbInstance.createObjectStore(STORE_NAME, { keyPath: 'order_id' });
                }
            };
        }

        document.getElementById('order-form').addEventListener('submit', e => {
            e.preventDefault();
            const newOrder = {
                order_id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                shop_name: document.getElementById('shop-name').value,
                customer_phone: document.getElementById('customer-phone').value,
                delivery_zone: document.getElementById('delivery-zone').value,
                items_summary: document.getElementById('items-summary').value,
                total_price_usd: parseFloat(document.getElementById('total-price').value).toFixed(2),
                payment_status: document.getElementById('payment-status').value,
                delivery_status: 'Pending',
                assigned_driver: 'Khaalid M.',
                created_at: new Date().toISOString()
            };

            const tx = db.transaction([STORE_NAME], 'readwrite');
            tx.objectStore(STORE_NAME).add(newOrder).onsuccess = () => {
                document.getElementById('order-form').reset();
                loadOrders();
            };
        });

        function loadOrders() {
            if (!db) return;
            const tx = db.transaction([STORE_NAME], 'readonly');
            tx.objectStore(STORE_NAME).getAll().onsuccess = e => renderOrders(e.target.result);
        }

        window.updateOrderStatus = function(orderId, newStatus) {
            const tx = db.transaction([STORE_NAME], 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            store.get(orderId).onsuccess = e => {
                let order = e.target.result;
                if (!order) return;
                order.delivery_status = newStatus;
                store.put(order);
                loadOrders();
            };
        };

        // Trigger native mobile dialer with USSD string for local networks
        window.triggerUSSDPayment = function(provider, amount) {
            let ussdString = "";
            if (provider === 'EVC Plus') {
                ussdString = `*711*${MERCHANT_CODE}*${amount}#`;
            } else if (provider === 'Sahal') {
                ussdString = `*883*${MERCHANT_CODE}*${amount}#`;
            }
            const encodedUSSD = ussdString.replace(/#/g, '%23');
            window.location.href = `tel:${encodedUSSD}`;
        };

        function renderOrders(orders) {
            const container = document.getElementById('orders-container');
            container.innerHTML = '';
            let pending = 0, completed = 0;

            orders.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            document.getElementById('order-count').innerText = `${orders.length} dalab`;

            if (orders.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl text-center text-gray-400 text-sm border border-gray-100">Ma jiraan dalabyo diiwaangashan.</div>`;
                document.getElementById('stat-pending').innerText = 0;
                document.getElementById('stat-completed').innerText = 0;
                return;
            }

            orders.forEach(order => {
                if (order.delivery_status === 'Delivered') completed++;
                else pending++;

                let badge = 'bg-amber-50 text-amber-700 border-amber-200';
                if (order.delivery_status === 'Dispatched') badge = 'bg-blue-50 text-blue-700 border-blue-200';
                if (order.delivery_status === 'Delivered') badge = 'bg-emerald-50 text-emerald-700 border-emerald-200';

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-3";
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded">${order.order_id}</span>
                        <span class="text-xs font-semibold px-2 py-0.5 rounded border ${badge}">${order.delivery_status}</span>
                    </div>
                    <div>
                        <div class="flex justify-between items-baseline">
                            <h4 class="font-bold text-gray-900 text-sm">${order.shop_name}</h4>
                            <span class="text-sm font-bold text-gray-900">$${order.total_price_usd}</span>
                        </div>
                        <p class="text-xs text-gray-600 mt-0.5">${order.items_summary}</p>
                        <p class="text-xs text-gray-400 mt-1">📍 ${order.delivery_zone} | 📱 ${order.customer_phone}</p>
                        <p class="text-xs text-emerald-600 font-medium mt-1">💳 ${order.payment_status}</p>
                    </div>

                    <!-- USSD Payment Action Buttons -->
                    <div class="grid grid-cols-2 gap-2 pt-2 border-t border-gray-100">
                        <button onclick="triggerUSSDPayment('EVC Plus', '${order.total_price_usd}')" class="bg-amber-600 text-white py-1.5 rounded-lg text-xs font-medium hover:bg-amber-700 transition flex items-center justify-center gap-1">
                            <span>📲 Bixi EVC</span>
                        </button>
                        <button onclick="triggerUSSDPayment('Sahal', '${order.total_price_usd}')" class="bg-blue-600 text-white py-1.5 rounded-lg text-xs font-medium hover:bg-blue-700 transition flex items-center justify-center gap-1">
                            <span>📲 Bixi Sahal</span>
                        </button>
                    </div>

                    <div class="flex gap-2 pt-1">
                        ${order.delivery_status === 'Pending' ? `
                            <button onclick="updateOrderStatus('${order.order_id}', 'Dispatched')" class="flex-1 bg-blue-600 text-white py-1.5 rounded-lg text-xs font-medium hover:bg-blue-700 transition">Dir (Dispatched)</button>
                        ` : ''}
                        ${order.delivery_status !== 'Delivered' ? `
                            <button onclick="updateOrderStatus('${order.order_id}', 'Delivered')" class="flex-1 bg-emerald-600 text-white py-1.5 rounded-lg text-xs font-medium hover:bg-emerald-700 transition">Gaarsii (Delivered)</button>
                        ` : `<span class="text-xs text-gray-400 italic w-full text-center py-1">Dalabkan Waa La Dhameeyay</span>`}
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-completed').innerText = completed;
        }

        window.addEventListener('DOMContentLoaded', initDB);

        // Register Service Worker matching production standard
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => {
                console.log("Service Worker registered successfully.");
            }).catch(err => console.error("SW registration failed:", err));
        }
    </script>
</body>
</html>
